<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <!-- Background -->
  <rect width="780" height="300" fill="#F9FAFC" rx="12"/>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A" letter-spacing="-0.5">Tech Stack</text>
  <line x1="140" y1="46" x2="640" y2="46" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Layer labels on left -->
  <text x="20" y="98" font-size="10" font-weight="600" fill="#64748B" letter-spacing="0.3">FRONTEND</text>
  <text x="20" y="158" font-size="10" font-weight="600" fill="#64748B" letter-spacing="0.3">BACKEND</text>
  <text x="20" y="218" font-size="10" font-weight="600" fill="#64748B" letter-spacing="0.3">RETRIEVAL</text>
  <text x="20" y="278" font-size="10" font-weight="600" fill="#64748B" letter-spacing="0.3">STORAGE</text>

  <!-- Horizontal rules -->
  <line x1="100" y1="64" x2="760" y2="64" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="100" y1="124" x2="760" y2="124" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="100" y1="184" x2="760" y2="184" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="100" y1="244" x2="760" y2="244" stroke="#E2E8F0" stroke-width="1"/>

  <!-- FRONTEND chips -->
  <rect x="108" y="72" width="170" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="193" y="87" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">Vanilla HTML / CSS / JS</text>
  <text x="193" y="102" text-anchor="middle" font-size="9" fill="#64748B">templates/index.html</text>

  <rect x="292" y="72" width="140" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="362" y="87" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">marked.js</text>
  <text x="362" y="102" text-anchor="middle" font-size="9" fill="#64748B">Markdown rendering</text>

  <rect x="446" y="72" width="160" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="526" y="87" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">SSE (EventSource)</text>
  <text x="526" y="102" text-anchor="middle" font-size="9" fill="#64748B">Live token streaming</text>

  <!-- BACKEND chips -->
  <rect x="108" y="132" width="130" height="36" rx="5" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/>
  <text x="173" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">FastAPI</text>
  <text x="173" y="162" text-anchor="middle" font-size="9" fill="#94A3B8">REST + SSE endpoints</text>

  <rect x="252" y="132" width="130" height="36" rx="5" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/>
  <text x="317" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Uvicorn</text>
  <text x="317" y="162" text-anchor="middle" font-size="9" fill="#94A3B8">ASGI server</text>

  <rect x="396" y="132" width="170" height="36" rx="5" fill="#2C3E1A" stroke="#2C3E1A" stroke-width="1.5"/>
  <text x="481" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Groq API</text>
  <text x="481" y="162" text-anchor="middle" font-size="9" fill="#A7B58A">llama-3.3-70b-versatile</text>

  <rect x="580" y="132" width="170" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="665" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">PyMuPDF</text>
  <text x="665" y="162" text-anchor="middle" font-size="9" fill="#64748B">PDF parsing</text>

  <!-- RETRIEVAL chips -->
  <rect x="108" y="192" width="160" height="36" rx="5" fill="#FFFFFF" stroke="#5A6D34" stroke-width="1.5"/>
  <text x="188" y="207" text-anchor="middle" font-size="11" font-weight="600" fill="#2C3E1A">BM25 (rank-bm25)</text>
  <text x="188" y="222" text-anchor="middle" font-size="9" fill="#5A6D34">Keyword · always on</text>

  <rect x="282" y="192" width="160" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="362" y="207" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">FAISS (faiss-cpu)</text>
  <text x="362" y="222" text-anchor="middle" font-size="9" fill="#64748B">Dense · USE_DENSE=1</text>

  <rect x="456" y="192" width="200" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="556" y="207" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">SentenceTransformers</text>
  <text x="556" y="222" text-anchor="middle" font-size="9" fill="#64748B">BGE-small + CrossEncoder</text>

  <!-- STORAGE chips -->
  <rect x="108" y="252" width="150" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="183" y="267" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">SQLite</text>
  <text x="183" y="282" text-anchor="middle" font-size="9" fill="#64748B">Cache · log · rate limiter</text>

  <rect x="272" y="252" width="130" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="337" y="267" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">FAISS Index</text>
  <text x="337" y="282" text-anchor="middle" font-size="9" fill="#64748B">faiss_index.faiss</text>

  <rect x="416" y="252" width="130" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="481" y="267" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">BM25 Pickle</text>
  <text x="481" y="282" text-anchor="middle" font-size="9" fill="#64748B">bm25_index.pkl</text>

  <rect x="560" y="252" width="140" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="630" y="267" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A">Metadata JSON</text>
  <text x="630" y="282" text-anchor="middle" font-size="9" fill="#64748B">chunk text + page info</text>
</svg>
